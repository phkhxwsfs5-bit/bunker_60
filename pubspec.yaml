name: bunker_06
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+36

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  flame: ^1.18.0
  provider: ^6.1.2
  geolocator: ^11.0.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_map: ^6.1.0     
  latlong2: ^0.9.0        
  url_launcher: ^6.3.2
  google_mobile_ads: ^9.1.0
  purchases_flutter: ^10.10.1 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.11

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
    - assets/calendar_blank.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#000000" 
  background_image: "assets/background.jpg"
  android: true
  ios: true
  fullscreen: true 
  android_12:
    color: "#000000"
    image: "assets/icon.png"

